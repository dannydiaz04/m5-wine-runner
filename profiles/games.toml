#   - xivmac         : Native XIV on Mac Swift wrapper (bundles Wine + DXMT + Dalamud)

[games.ffxiv]
name = "Final Fantasy XIV"
tier = "Tier 1: Zero Lift"
engine = "Custom (DX11)"
backend = "xivmac"
alt_backends = ["dxmt"]
steam_app_id = 39210
exe_rel_paths = [
    "game/ffxiv_dx11.exe",
    "boot/ffxivboot.exe",
]
launch_args = []
winetricks = []
dlss_metalfx = false
require_avx = false
dll_overrides = { d3d11 = "n,b", dxgi = "n,b" }
env = {}
hooks = ["launch_xiv_on_mac"]
notes = "Delegates to XIV on Mac (https://www.xivmac.com/) to handle Square Enix encrypted OAuth launcher token flow with native DXMT."

